name: Validate AIPE-Workflows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  engine:
    name: engine tests, workflow contract, Registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: AIPE-Workflows

      # Sibling checkouts used by capability discovery and by the manifest validation. Default branches only.
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Core, path: AIPE-Core }
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Registry, path: AIPE-Registry }
      # Electrical-Design and Thermal-Design publish their manifests (ids aipe.electrical-design / aipe.thermal-design)
      # through FulongLi/AIPE-Electrical-Design#3 and FulongLi/AIPE-Thermal-Design#2; the PR heads are checked out until merged.
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Electrical-Design, path: AIPE-Electrical-Design, ref: refs/pull/3/head }
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Thermal-Design, path: AIPE-Thermal-Design, ref: refs/pull/2/head }
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Simulation-Skills, path: AIPE-Simulation-Skills }
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Semiconductor-Database, path: AIPE-Semiconductor-Database }
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Magnetics-Database, path: AIPE-Magnetics-Database }
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-Field-Simulation, path: AIPE-Field-Simulation }
      # The official CAD repository receives its implementation (and manifest) through FulongLi/AIPE-CAD-Agent#1;
      # the PR head is checked out until that PR is merged, then the ref line is removed.
      - uses: actions/checkout@v4
        with: { repository: FulongLi/AIPE-CAD-Agent, path: AIPE-CAD-Agent, ref: refs/pull/1/head }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the engine and the Core / Registry validator requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e AIPE-Workflows[dev]
          python -m pip install -r AIPE-Core/requirements-dev.txt
          python -m pip install -r AIPE-Registry/requirements-dev.txt

      - name: "Engine unit tests (solver-marked tests deselected; no ngspice on this runner)"
        working-directory: AIPE-Workflows
        run: python -m pytest -q -ra -m "not solver" --junitxml=pytest-engine.xml

      - name: Workflow definition parses and the task graph resolves
        working-directory: AIPE-Workflows
        run: |
          python - <<'EOF'
          from aipe_workflows.engine.graph import load_workflow_definition
          d = load_workflow_definition("workflows/converter_dab/workflow.yaml")
          print(d.id, len(d.tasks), [t.id for t in d.tasks])
          assert len(d.tasks) >= 14
          EOF

      - name: "Environment doctor runs (tools are expected to be absent here; the command itself must succeed)"
        working-directory: AIPE-Workflows
        run: |
          aipe-workflows doctor --json > doctor.json
          python - <<'EOF'
          import json
          tools = json.load(open("doctor.json"))["tools"]
          print({name: info["found"] for name, info in tools.items()})
          EOF

      - name: "Plan against the sibling checkouts (capabilities must resolve; only missing tools or packages may block)"
        working-directory: AIPE-Workflows
        run: |
          set +e
          aipe-workflows plan examples/dab-10kw/specification.yaml --checkouts .. --json > plan.json
          code=$?
          set -e
          test $code -eq 0 -o $code -eq 2   # 2 = non-optional tasks blocked by missing tools/packages, which is expected on this runner
          python - <<'EOF'
          import json
          plan = json.load(open("plan.json"))
          unregistered = [t["id"] for t in plan["tasks"] if not t["capability_registered"]]
          # Acceptable on this runner: a missing external tool or a missing specialist Python package. Anything else
          # (adapter import error, invalid binding, unregistered capability) is a contract defect and fails the job.
          ACCEPTABLE = ("tool ", "not installed", "not found", "not importable", "not loadable")
          bad = {t["id"]: [b for b in t["blockers"] if not any(pat in b for pat in ACCEPTABLE)] for t in plan["tasks"]}
          bad = {k: v for k, v in bad.items() if v}
          print("tasks:", len(plan["tasks"]), "| unregistered capabilities:", unregistered, "| unexpected blockers:", bad)
          assert not unregistered, "every task capability must be registered in a sibling manifest or the Registry index"
          assert not bad, "blockers other than missing tools/packages mean a broken adapter or contract"
          EOF

      - name: "Manifests validate against the Registry schema (explicit complete set; failures fail this job)"
        run: |
          python AIPE-Registry/scripts/validate.py \
            AIPE-Workflows/aipe.yaml AIPE-Core/aipe.yaml AIPE-Registry/aipe.yaml \
            AIPE-Electrical-Design/aipe.yaml AIPE-Thermal-Design/aipe.yaml AIPE-Simulation-Skills/aipe.yaml \
            AIPE-Semiconductor-Database/aipe.yaml AIPE-Magnetics-Database/aipe.yaml \
            AIPE-Field-Simulation/aipe.yaml AIPE-CAD-Agent/aipe.yaml \
            --today "$(date -u +%F)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflows-ci-evidence
          path: |
            AIPE-Workflows/pytest-engine.xml
            AIPE-Workflows/doctor.json
            AIPE-Workflows/plan.json
          if-no-files-found: ignore
