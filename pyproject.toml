[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-workflows"
version = "0.1.0"
description = "AIPE system-level engineering workflow engine: typed DAG execution, capability discovery, environment qualification, checkpoints, verification gates and report assembly for simulation-driven converter design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIPE contributors" }]
keywords = ["power electronics", "workflow", "DAG", "engineering automation", "AIPE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema[format]>=4.18,<5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
simulation = ["aipe-simulation-skills>=0.2.0", "h5py>=3.8"]
plot = ["matplotlib>=3.7"]

[project.scripts]
aipe-workflows = "aipe_workflows.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aipe_workflows*"]

[tool.setuptools.package-data]
aipe_workflows = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solver: executes a real external solver; skipped when it is not installed",
    "siblings: needs sibling AIPE repository checkouts next to this one",
]
