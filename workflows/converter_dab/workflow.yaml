# AIPE converter workflow definition: dual active bridge (DAB) DC/DC converter.
# Versioned machine-readable task graph consumed by aipe_workflows.engine.
schema_version: 0.1.0
id: aipe.workflow.converter-dab
name: Simulation-driven dual-active-bridge converter design
description: >
  Requirements -> analytical SPS design -> executed ngspice switching simulation (Levels 1 and 2) with
  waveform analysis -> magnetics design, device screening and loss evaluation, control baseline,
  cooling comparison and heat-sink screening -> executed Gmsh/Elmer FEM checks of the transformer
  window and the heat-sink candidate -> parametric FreeCAD geometry of the transformer and heat sink -> KiCad ERC/DRC of the AIPE-PCB-Agent boards. Every task declares the Registry capability it needs, the external tools
  it depends on and the verification gate its result belongs to.
engineering_state:
  schema_version: 0.1.0
metadata:
  benchmark: 10 kW, 800 V to 400 V, 100 kHz, single phase shift
  owner: AIPE-Workflows
tasks:
  - id: requirements
    description: Build and validate the initial Engineering State from the specification (requested ratings, labelled assumptions, reference-design sources).
    capability: engineering-state-schema
    adapter: aipe_workflows.adapters.requirements:RequirementsTask
    depends_on: []
    inputs:
      specification: $spec   # the whole specification: any change re-executes requirements and everything downstream
    outputs: [state_id, requirements, converter, constraints, environment]
    gate: software

  - id: analytic-sps
    description: Lossless single-phase-shift analysis of the nominal operating point (AIPE-Design-Agent converter mathematics).
    capability: converter-concept-calculation
    adapter: aipe_workflows.adapters.design_agent:AnalyticSpsTask
    depends_on: [requirements]
    inputs:
      requirements: $task.requirements.requirements
      converter: $task.requirements.converter
    outputs: [summary, phi_rad, phi_deg, power_W, i_L_rms_A, i_L_peak_A, i_dc1_A, i_dc2_A, i_L_at_centre_origin_A, evidence_id]
    gate: analytical

  - id: circuit-sim-level1
    description: Executed ngspice Level 1 (ideal switching) DAB transient, steady-state identification, waveform metrics and comparison with the analytical reference.
    capability: switching-circuit-simulation
    adapter: aipe_workflows.adapters.simulation_skills:DabNgspiceTask
    depends_on: [requirements, analytic-sps]
    tools: [ngspice]
    inputs:
      requirements: $task.requirements.requirements
      converter: $task.requirements.converter
      analytic: $task.analytic-sps
    parameters:
      level: 1
      initial_conditions: analytic
      comparison_tolerance: 0.01
      sim: {cycles: 24, max_step_fraction: 400}
    outputs: [run_dir, dataset, dataset_sha256, summary_path, valid, p_in_W, p_out_W, loss_W, efficiency, i_dc1_A, i_dc2_A,
              i_L_rms_A, i_L_peak_A, i_s_rms_A, i_s_peak_A, i_m_peak_A, flux_linkage_pp_Vs, measured_phase_shift_deg, switches,
              zvs_overview, energy_unaccounted_W, steady_state, comparison_vs_analytic, figures, circuit_spec_sha256]
    gate: circuit_simulation

  - id: circuit-sim-level1-convergence
    description: Time-step convergence check of the Level 1 model (finer maximum step) to bound the numerical uncertainty of the waveform metrics.
    capability: switching-circuit-simulation
    adapter: aipe_workflows.adapters.simulation_skills:DabNgspiceTask
    depends_on: [requirements, analytic-sps, circuit-sim-level1]
    tools: [ngspice]
    optional: true
    inputs:
      requirements: $task.requirements.requirements
      converter: $task.requirements.converter
      analytic: $task.analytic-sps
    parameters:
      level: 1
      initial_conditions: analytic
      comparison_tolerance: 0.01
      sim: {cycles: 16, max_step_fraction: 1600}
    outputs: [p_out_W, i_L_rms_A, i_L_peak_A, switches, comparison_vs_analytic, steady_state]
    gate: circuit_simulation

  - id: circuit-sim-level2
    description: >
      Executed ngspice Level 2 (non-ideal behavioural) DAB transient: 200 ns dead time, resistive on-state at
      Tj = 125 degC, energy-equivalent linear Coss, one-point body-diode fit, DC-link ESR/ESL and an RC output port.
      Parameters are datasheet-sourced (Wolfspeed C3M0040120K / C3M0025065K, TIDUES0) or labelled assumptions; see
      examples/dab-10kw/level2-circuit-spec.yaml for the sources.
    capability: switching-circuit-simulation
    adapter: aipe_workflows.adapters.simulation_skills:DabNgspiceTask
    depends_on: [requirements, analytic-sps, circuit-sim-level1]
    tools: [ngspice]
    inputs:
      requirements: $task.requirements.requirements
      converter: $task.requirements.converter
      analytic: $task.analytic-sps
    parameters:
      level: 2
      initial_conditions: analytic
      comparison_tolerance: 0.10   # sanity check only: the behavioural model deviates from the lossless analytic reference through losses, magnetising current and dead time
      dead_time_s: 200.0e-9
      switch: {r_on: 0.0587, c_oss: 187.0e-12, c_oss_esr: 1.0, d_is: 1.0e-12, d_n: 4.0, d_rs: 0.117, d_cjo: 0.0, gate_rise_fall: 20.0e-9}
      port2: {type: rc_load, capacitance: 60.0e-6, esr: 0.005, esl: 20.0e-9, load_resistance: 16.0, initial_voltage: 399.0, local_decoupling_capacitance: 6.6e-6, local_decoupling_esr: 0.002, local_decoupling_esl: 0.5e-9}
      dc_link1: {capacitance: 30.0e-6, esr: 0.005, esl: 20.0e-9, source_resistance: 0.05, source_inductance: 1.0e-6, local_decoupling_capacitance: 6.6e-6, local_decoupling_esr: 0.002, local_decoupling_esl: 0.5e-9}
      sim: {cycles: 160, max_step_fraction: 400, abstol: 1.0e-8, vntol: 1.0e-5}
    outputs: [run_dir, dataset, dataset_sha256, summary_path, valid, p_in_W, p_out_W, loss_W, efficiency, i_dc1_A, i_dc2_A,
              i_L_rms_A, i_L_peak_A, i_s_rms_A, i_s_peak_A, i_m_peak_A, flux_linkage_pp_Vs, measured_phase_shift_deg, switches,
              zvs_overview, energy_unaccounted_W, steady_state, comparison_vs_analytic, figures, circuit_spec_sha256]
    gate: circuit_simulation

  - id: magnetics-transformer-design
    description: >
      Waveform-informed transformer design (AIPE-Magnetics-Database): exact harmonics of the executed Level 1 winding currents,
      flux from the integral of the transformer voltage, iGSE core loss, per-layer harmonic Dowell copper loss, 1-D leakage and the
      external inductance still required; ranked integer-turn candidates with saturation, fill and thermal constraints.
    capability: magnetics-waveform-informed-transformer-design
    adapter: aipe_workflows.adapters.magnetics_database:WaveformInformedTransformerTask
    depends_on: [requirements, analytic-sps, circuit-sim-level1]
    inputs:
      requirements: $task.requirements.requirements
      analytic: $task.analytic-sps
      simulation: $task.circuit-sim-level1
    parameters:
      materials: null              # every catalogue material with sufficient data (currently N87 for 100 degC)
      design_temperature_K: 373.15
      loss_density_target_W_per_m3: 300000.0
      max_candidates: 12
    outputs: [selected_core, selected_candidate, candidates_top, candidate_counts, turns_primary, turns_secondary, turns_ratio_actual,
              leakage_inductance_H, external_inductance_required_H, magnetising_inductance_H, core_loss_W, copper_loss_W, total_loss_W,
              flux_density_peak_T, hot_spot_temperature_rise_K, excitation, square_current_comparison, material_comparison_summary,
              measurement_requests_count, loss_model_verification, result_path]
    gate: analytical

  - id: semiconductor-screening
    description: >
      Waveform-driven device screening and loss evaluation (AIPE-Semiconductor-Database): per-switch RMS, average, peak and
      turn-off currents of the executed Level 2 dataset against the canonical and candidate SiC records; derating, current margin,
      ZVS current condition, junction headroom; losses of the selected devices on the sampled waveforms (manufacturer PLECS
      tensors / datasheet points, tiered). Discrete packages preferred because the thermal, CAD and PCB stages are laid out for TO-247.
    capability: semiconductor-dab-screening
    adapter: aipe_workflows.adapters.semiconductor_database:DabDeviceScreeningTask
    depends_on: [requirements, circuit-sim-level2]
    inputs:
      requirements: $task.requirements.requirements
      simulation: $task.circuit-sim-level2
    parameters:
      junction_temperature_K: 398.15      # evaluation temperature 125 degC (design target, assumption)
      tj_limit_K: 398.15
      derating: 0.70
      rth_case_sink_K_per_W: 0.1          # TIDUES0 pad value (sourced reference)
      rth_sink_ambient_K_per_W: 0.5       # TIDUES0 catalogue sink (sourced reference; airflow condition not stated)
      ambient_K: 313.15
      rg_on_Ohm: 2.5                      # lowest value inside the PLECS Eoff model range of the Wolfspeed records
      rg_off_Ohm: 2.5
      preferred_integration: discrete
    outputs: [screening_path, dataset_sha256, settings, preferred_integration,
              primary_worst_case_switch, primary_stress, primary_ranked, primary_excluded_count, primary_selected, primary_device_id, primary_part_number,
              primary_loss_W, primary_rth_jc_K_per_W, primary_tj_max_rating_K, primary_loss_evaluation, primary_top_ranked_overall,
              secondary_worst_case_switch, secondary_stress, secondary_ranked, secondary_excluded_count, secondary_selected, secondary_device_id, secondary_part_number,
              secondary_loss_W, secondary_rth_jc_K_per_W, secondary_tj_max_rating_K, secondary_loss_evaluation, secondary_top_ranked_overall,
              semiconductor_loss_total_W_at_tj, junction_temperature_K]
    gate: analytical

  - id: control-baseline
    description: >
      SPS digital control baseline (AIPE-Simulation-Skills control): discrete PI current loop and 2P2Z voltage loop designed on the
      cycle-averaged plant of the actual converter parameters, host closed-loop scenarios (soft start, load steps, input sag, protection
      latch), and a plant-law cross-check against executed ngspice Level 1 runs at three phase shifts.
    capability: averaged-control-analysis
    adapter: aipe_workflows.adapters.control_baseline:SpsControlBaselineTask
    depends_on: [requirements, analytic-sps]
    tools: [ngspice]
    inputs:
      requirements: $task.requirements.requirements
      analytic: $task.analytic-sps
    parameters:
      dead_time_s: 200.0e-9
      verification_phase_shifts_deg: [10.0, 22.5, 35.0]
      verification_cycles: 12
      plant_verification_tolerance: 0.03
      min_phase_margin_deg: 40.0
    outputs: [design_sha256, operating_point, sampling, current_loop, voltage_loop, loop_margins, current_loop_crossover_Hz,
              current_loop_phase_margin_deg, current_loop_gain_margin_dB, voltage_loop_crossover_Hz, voltage_loop_phase_margin_deg,
              voltage_loop_gain_margin_dB, worst_phase_margin_deg, scenarios, plant_verification_rows, plant_verification_max_abs_rel_err_p2,
              plant_verification_all_valid, model_assumptions, limitations, summary_path]
    gate: analytical

  - id: thermal-cooling-design
    description: >
      Cooling comparison and Stage A heat-sink screening (AIPE-Design-Agent pea.thermal with the corrected HeatSinkOptimisation
      correlations): the selected devices' evaluated losses and database junction-to-case resistances on a shared sink per bridge
      under natural convection, forced air and a liquid cold plate; seeded Pareto screening of plate-fin geometries under extrusion
      bounds with candidates flagged for FEM verification. Analytical correlations only.
    capability: thermal-cooling-screening
    adapter: aipe_workflows.adapters.thermal_design:CoolingDesignTask
    depends_on: [requirements, semiconductor-screening]
    inputs:
      requirements: $task.requirements.requirements
      environment_spec: $task.requirements.environment
      semiconductors: $task.semiconductor-screening
    parameters:
      devices_per_sink: 4
      rth_case_sink_K_per_W: 0.1
      footprint_area_m2: 3.2e-4           # generic TO-247 contact outline 16 x 20 mm (assumption)
      tj_design_C: 125.0
      stage_a:
        cooling: forced
        materials: [Al-6063-T5]
        bounds: {length: [0.08, 0.16], width: [0.06, 0.12], fin_height: [0.015, 0.05], fin_thickness: [0.002, 0.004], fin_gap: [0.004, 0.012], base_thickness: [0.004, 0.01]}
        flow_bounds: [0.003, 0.015]
        objectives: [r_th, mass, fan_power_W]
        n_weights: 5
        n_epsilon: 3
        maxiter: 25
        popsize: 10
        seed: 1
    outputs: [worst_bridge, t_ambient_C, devices_per_sink, device_powers_W, comparison, best_option, tj_max_best_option_C,
              tj_max_by_option_C, stage_a_summary, stage_a_knee_candidate, stage_a_flagged, fem_candidate_geometry, assumptions, result_paths]
    gate: analytical

  - id: fem-transformer-window
    description: >
      Executed Gmsh + Elmer 2-D magnetostatics of the transformer window with the turns of the selected magnetics candidate at the
      executed peak primary current: leakage and magnetising inductance at two mesh levels, energy and ampere-turn checks, comparison
      with the analytical 1-D leakage of the magnetics design (feedback example C).
    capability: fem-magnetostatics-2d
    adapter: aipe_workflows.adapters.field_simulation:TransformerLeakageFemTask
    depends_on: [requirements, circuit-sim-level1, magnetics-transformer-design]
    tools: [gmsh, elmer]
    inputs:
      requirements: $task.requirements.requirements
      simulation: $task.circuit-sim-level1
      magnetics: $task.magnetics-transformer-design
    parameters:
      levels: [0, 1]
      harmonic: false
    outputs: [L_leakage_primary_H_fem, L_leakage_primary_H_1d_estimate, L_magnetising_primary_H_fem, L_leakage_primary_H_magnetics_design,
              leakage_fem_vs_magnetics_relative, max_B_window_T, turns, interleaved, convergence, checks, summary_path, geometry_note]
    gate: field_simulation

  - id: fem-heatsink
    description: >
      Executed Gmsh + Elmer 3-D conduction of the Stage A knee heat-sink candidate with two selected devices at their evaluated
      losses and the candidate's correlation film coefficient; hotspot temperature and thermal resistance at two mesh levels,
      energy balance, comparison with the analytical candidate resistance (Stage B verification of the screening).
    capability: fem-thermal-conduction
    adapter: aipe_workflows.adapters.field_simulation:HeatSinkFemTask
    depends_on: [requirements, semiconductor-screening, thermal-cooling-design]
    tools: [gmsh, elmer]
    inputs:
      requirements: $task.requirements.requirements
      environment_spec: $task.requirements.environment
      semiconductors: $task.semiconductor-screening
      thermal: $task.thermal-cooling-design
    parameters:
      levels: [0, 1]
    outputs: [device_power_W, h_W_per_m2_K, T_ambient_K, T_max_K, T_rise_hotspot_K, R_th_hotspot_K_per_W, R_th_footprint_mean_K_per_W,
              Q_convective_W, R_th_analytical_candidate_K_per_W, R_th_fem_vs_analytical_relative, geometry, convergence, checks, summary_path, geometry_note]
    gate: field_simulation

  - id: cad-transformer
    description: >
      Parametric FreeCAD model of the selected transformer candidate (AIPE-CAD-Agent): catalogue core outline, the magnetics
      parametric winding layout as concentric litz windings in the same radial order (P-S-P), barrier, pins, clips and base
      plate; FCStd/STEP export with re-import check, mass per material, interference, fit and clearance checks against
      illustrative caller-supplied requirements.
    capability: parametric-transformer-cad
    adapter: aipe_workflows.adapters.cad_agent:TransformerCadTask
    depends_on: [requirements, magnetics-transformer-design]
    tools: [freecad]
    inputs:
      magnetics: $task.magnetics-transformer-design
    parameters:
      timeout_s: 900
    outputs: [core, core_name, windings, barrier_m, margin_m, bbox_m, size_m, volume_m3, mass_kg, mass_by_material_kg, body_count,
              magnetics_mass_kg, magnetics_copper_mass_kg, check_status, check_summary, clearance, step_reimport, analytic_vs_cad, files, warnings, limitations]
    gate: cad_pcb

  - id: cad-heatsink
    description: >
      Parametric FreeCAD model of the Stage A knee heat-sink candidate with two selected TO-247 devices on isolation pads
      (AIPE-CAD-Agent): FCStd/STEP, mass per material compared with the correlation model's mass, interference and clearance checks.
    capability: heat-sink-cad
    adapter: aipe_workflows.adapters.cad_agent:HeatSinkCadTask
    depends_on: [requirements, semiconductor-screening, thermal-cooling-design]
    tools: [freecad]
    inputs:
      thermal: $task.thermal-cooling-design
      semiconductors: $task.semiconductor-screening
    parameters:
      timeout_s: 900
      device_spacing_m: 0.024
    outputs: [candidate_id, bridge, device_part_number, geometry, bbox_m, size_m, volume_m3, mass_kg, mass_by_material_kg, body_count,
              sink_mass_cad_kg, sink_mass_analytical_kg, sink_mass_cad_vs_analytical_relative, check_status, check_summary, clearance,
              step_reimport, analytic_vs_cad, files, warnings]
    gate: cad_pcb

  - id: pcb-erc-drc
    description: >
      Executed KiCad ERC and DRC (with schematic parity) on the three DAB boards generated and routed by AIPE-PCB-Agent
      (primary power, secondary power, control). The task only checks; it fails with the counts when any board has ERC/DRC
      errors, unconnected items or parity errors, so the cad_pcb gate is never shown as passed with unrouted connections.
    capability: native-erc-drc-verification
    adapter: aipe_workflows.adapters.pcb_agent:KicadBoardChecksTask
    depends_on: [requirements]
    tools: [kicad-cli]
    optional: true
    inputs:
      requirements: $task.requirements.requirements
    parameters:
      example_dir: examples/dab-10kw
      timeout_s: 900
    outputs: [boards, sources, totals, all_clean, kicad_version, pcb_agent_verification_records, example_dir]
    gate: cad_pcb
